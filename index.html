<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seraj Tutorial – Tech Video Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF0F6;--ink:#15163A;--mute:#575a7d;--blue:#2D3BFF;--sun:#FFD84D;--card:#fff;--line:#d5d8e6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14152B;--ink:#EEF0FA;--mute:#a3a7c8;--blue:#7B86FF;--card:#1F2140;--line:#33365e}}
:root[data-theme="dark"]{--bg:#14152B;--ink:#EEF0FA;--mute:#a3a7c8;--blue:#7B86FF;--card:#1F2140;--line:#33365e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,sans-serif;line-height:1.55}
main{max-width:920px;margin:0 auto;padding:0 20px}
a{color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
nav{display:flex;gap:20px;padding:20px 0;font-weight:600;flex-wrap:wrap}
nav a{text-decoration:none}nav a:hover{text-decoration:underline}
.hero{display:grid;grid-template-columns:1fr auto;gap:14px 16px;align-items:start;margin:20px 0 28px}.hero .lead{grid-column:1/-1}
@media (min-width:720px){.hero{gap:18px 32px}.photo{width:440px;grid-column:2;grid-row:1/3}.hero .lead{grid-column:1}}
.photo{margin:0;width:100%;grid-column:1/-1;position:relative}
.photo:before{display:none}
.photo img{display:block;width:100%;height:auto;aspect-ratio:1/1;object-fit:contain;border:0;border-radius:0}
h1{font-size:clamp(1.7rem,7.5vw,5.6rem);line-height:1;margin:0;font-weight:800;letter-spacing:-.03em}
@media (min-width:720px){h1{font-size:clamp(2.6rem,6vw,4.4rem)}}
.lead{font-size:1.2rem;max-width:34ch;color:var(--mute);margin:0}
.tl{position:relative;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px 12px 12px;overflow:hidden;touch-action:none;cursor:ew-resize}
.tl .row{display:flex;gap:4px;margin-bottom:6px;height:34px}
.tl .row i{display:block;border-radius:4px;background:var(--blue)}
.tl .row i.b{background:var(--sun)}.tl .row i.c{background:var(--ink);opacity:.85}.tl .row i.g{background:var(--line)}
.ph{position:absolute;top:0;bottom:0;width:2px;background:#ff3b5c;left:30%}
.ph:before{content:"";position:absolute;top:0;left:-6px;border:7px solid transparent;border-top-color:#ff3b5c}
.tc{font-variant-numeric:tabular-nums;color:var(--mute);font-size:.9rem;margin:8px 0 0}
section{padding:64px 0 0}
h2{font-size:2rem;margin:0 0 20px;letter-spacing:-.02em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.w{display:block;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.w:hover{border-color:var(--blue)}
.th{aspect-ratio:16/9;display:grid;place-items:center;font-size:2.2rem;color:#fff}
.w div.t{padding:12px 14px}.w b{display:block}.w span{color:var(--mute);font-size:.92rem}
.sv{display:grid;gap:12px;padding:0;list-style:none;margin:0}
.sv li{padding:14px 0;border-bottom:1px solid var(--line)}.sv b{display:block;font-size:1.1rem}.sv span{color:var(--mute)}
.btn{display:inline-block;background:var(--ink);color:var(--bg);padding:14px 22px;border-radius:6px;font-weight:600;text-decoration:none;margin:8px 10px 0 0;border:2px solid var(--ink);font:inherit;font-weight:600;cursor:pointer}
.btn.alt{background:none;color:var(--ink);border:2px solid var(--ink)}
/* Effects */
.fx-intro{color:var(--mute);max-width:60ch;margin:0 0 16px}
.cmd{display:flex;gap:8px;align-items:stretch;margin:0 0 16px}
.cmd code{flex:1;min-width:0;overflow-x:auto;white-space:nowrap;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:6px;font-size:.85rem}
.cmd button{background:var(--sun);color:#15163A;border:0;border-radius:6px;padding:0 16px;font:inherit;font-weight:600;cursor:pointer}
.fx-search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font:inherit;margin:0 0 16px}
.fxg{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.fx{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.fx small{color:var(--mute);font-variant-numeric:tabular-nums}
.fx b{display:block;color:var(--blue);font-family:ui-monospace,Menlo,monospace;font-size:.95rem}
.fx span{color:var(--mute);font-size:.9rem}
.fx-note{color:var(--mute);font-size:.85rem;margin-top:16px}
footer{padding:64px 0 40px;color:var(--mute);font-size:.9rem}
</style>
</head>
<body>
<main>
<nav><a href="#work">Kaam</a><a href="#effects">Effects</a><a href="#services">Services</a><a href="#contact">Contact</a></nav>

<header>
<div class="hero">
<h1>Seraj Tutorial,<br>tech video editor.</h1>
<figure class="photo"><img src="photo.webp" alt="Seraj Tutorial ki photo" width="1024" height="1024"></figure>
<p
